name: Build APK & Publish Release to idlanyor/quran-app

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag versi rilis (contoh: v2.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Digital Quran APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore for Debug & Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "STORE_PASSWORD=${STORE_PASSWORD_SECRET}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASSWORD_SECRET}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass nurquran123 \
              -alias upload \
              -keypass nurquran123 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=NurQuran Release,OU=Mobile,O=NurQuran,L=Jakarta,ST=DKI,C=ID"
            echo "STORE_PASSWORD=nurquran123" >> $GITHUB_ENV
            echo "KEY_PASSWORD=nurquran123" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV

      - name: Build Debug & Release APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
          else
            gradle assembleDebug assembleRelease --no-daemon --stacktrace
          fi

      - name: Rename APKs for Distribution
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/DigitalQuran-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/DigitalQuran-release.apk
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DigitalQuran-APKs
          path: |
            dist/DigitalQuran-release.apk
            dist/DigitalQuran-debug.apk
          retention-days: 30

      - name: Determine Release Tag
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        id: release_meta
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="$REQUESTED_RELEASE_TAG"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Publish Release to github.com/idlanyor/quran-app/releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          repository: idlanyor/quran-app
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: "Digital Qur'an ${{ steps.release_meta.outputs.tag_name }}"
          generate_release_notes: true
          body: |
            ## Digital Qur'an ${{ steps.release_meta.outputs.tag_name }}

            Pedoman Hidup dalam Genggaman.

            ### Unduh File APK:
            - **`DigitalQuran-release.apk`**: Versi rilis siap pasang (direkomendasikan).
            - **`DigitalQuran-debug.apk`**: Versi pengujian/debug.

            ### Pembaruan di v2.0.0:
            - **Redesain Antarmuka Penuh**: Tema Islami Midnight Indigo & Warm Ivory/Copper Gold sesuai mockup resmi.
            - **Layar Tafsir Baru**: Tampilan satu layar penuh dengan lengkungan kubah, navigasi ayat, terjemahan, dan akordeon tafsir.
            - **Splash Screen Baru**: Transisi native yang mulus menggunakan Android 12+ SplashScreen API.
            - **Murottal Audio Player**: Mini player mengambang dan layar player lengkap dengan pilihan qari serta playlist per ayat.
            - **Pencarian Ayat Pintar**: Filter relevansi, highlight kata kunci, dan kata kunci populer.
            - **Jadwal Salat & Kompas Kiblat**: Jadwal waktu salat akurat berdasarkan lokasi dan penunjuk arah kiblat presisi.
          files: |
            dist/DigitalQuran-release.apk
            dist/DigitalQuran-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

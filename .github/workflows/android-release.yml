name: Verify Android & Prepare Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag versi rilis (contoh: v2.0.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Lint, tests & debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare debug keystore
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
      - name: Verify app
        run: |
          chmod +x gradlew
          ./gradlew :app:lintRelease :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-checks
          path: |
            app/build/reports/lint-results-release.*
            app/build/reports/tests/testDebugUnitTest/
            app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  prepare-release:
    name: Signed APK, Play Store AAB & draft release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate version and notes
        id: version
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then TAG_NAME="$REQUESTED_RELEASE_TAG"; fi
          [[ "$TAG_NAME" == "v$VERSION" ]] || { echo 'Tag must match versionName'; exit 1; }
          test -f "docs/releases/$TAG_NAME.md"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
      - name: Restore existing release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_PASSWORD" ]] || {
            echo 'Existing signing secrets are required. A replacement release key will not be generated.'; exit 1;
          }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          chmod 600 "$RUNNER_TEMP/upload.jks"
      - name: Build signed release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --no-configuration-cache
      - name: Prepare distribution files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/DigitalQuran-$VERSION-release.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/DigitalQuran-$VERSION-playstore.aab"
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: DigitalQuran-${{ steps.version.outputs.version }}-release
          path: |
            dist/
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
      - name: Prepare GitHub Release draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Digital Qur'an ${{ steps.version.outputs.tag }}
          draft: true
          body_path: docs/releases/${{ steps.version.outputs.tag }}.md
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/*.aab
            dist/SHA256SUMS.txt
